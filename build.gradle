plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/dreamcore.accesswidener")
	runs {
		client {
			programArg "--username"
			programArg "kepkadudoy!"
		}
	}
}

base {
	archivesName = project.archives_base_name
}
configurations {
    addtojar
}
repositories {
    maven {
        name = "meteor-maven"
        url = "https://maven.meteordev.org/releases"
    }
    flatDir {
        dirs 'libs'   // PyTorch / DJL jar-ы лежат в папке libs/
    }
}

dependencies {
    implementation "meteordevelopment:orbit:0.2.3"
    implementation "org.json:json:20240303"
    addtojar "meteordevelopment:orbit:0.2.3"
    addtojar "org.json:json:20240303"

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	compileOnly 'org.projectlombok:lombok:1.18.34'
	annotationProcessor 'org.projectlombok:lombok:1.18.34'

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ═══════════════════════════════════════════════════════
    // PyTorch / DJL jar-ы (положи их в папку libs/ в корне проекта)
    // ═══════════════════════════════════════════════════════
    implementation files('libs/api-0.36.0.jar')
    implementation files('libs/gson-2.11.0.jar')
    implementation files('libs/jna-5.14.0.jar')
    implementation files('libs/pytorch-engine-0.36.0.jar')
    implementation files('libs/pytorch-jni-2.7.1-0.36.0.jar')
    implementation files('libs/pytorch-native-cpu-2.7.1-win-x86_64.jar')
    implementation files('libs/slf4j-api-2.0.13.jar')
    implementation files('libs/slf4j-simple-2.0.13.jar')

    // Чтобы все эти jar-ы попали в финальный мод-jar:
    addtojar files('libs/api-0.36.0.jar')
    addtojar files('libs/gson-2.11.0.jar')
    addtojar files('libs/jna-5.14.0.jar')
    addtojar files('libs/pytorch-engine-0.36.0.jar')
    addtojar files('libs/pytorch-jni-2.7.1-0.36.0.jar')
    addtojar files('libs/pytorch-native-cpu-2.7.1-win-x86_64.jar')
    addtojar files('libs/slf4j-api-2.0.13.jar')
    addtojar files('libs/slf4j-simple-2.0.13.jar')
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
    from {
        configurations.addtojar.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {}
}
